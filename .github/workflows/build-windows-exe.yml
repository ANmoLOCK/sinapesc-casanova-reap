name: Build Sinapesc Windows EXE

on:
  push:
    branches:
      - cursor/sinapesc-desktop-exe-46d6
      - cursor/consulta-rgp-46d6
      - cursor/consulta-rgp-ui-opcoes-46d6
      - cursor/consulta-rgp-fix-mpa-46d6
      - cursor/consulta-rgp-layout-govbr-46d6
      - cursor/consulta-rgp-senha-planilha-46d6
      - cursor/consulta-rgp-ui-reform-46d6
      - cursor/consulta-rgp-scroll-modal-46d6
      - cursor/consulta-rgp-cpf-ui-46d6
      - cursor/consulta-rgp-cpf-battery-46d6
      - cursor/consulta-rgp-cpf-json-46d6
      - cursor/consulta-rgp-footer-46d6
      - cursor/consulta-rgp-lote-audit-46d6
      - cursor/consulta-rgp-govbr-edit-46d6
      - cursor/consulta-rgp-funcoes-46d6
      - cursor/consulta-rgp-import-relatorio-46d6
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sinapesc-desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm build_exe.spec

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\SinapescREAP.exe release\
          Copy-Item config.example.json release\config.json
          Copy-Item COMO_INTEGRAR_API.md release\
          Copy-Item README.md release\
          if (Test-Path ..\LICENSE) { Copy-Item ..\LICENSE release\ }
          if (Test-Path ..\COPYRIGHT) { Copy-Item ..\COPYRIGHT release\ }
          if (Test-Path ..\docs\DIREITOS-AUTORAIS.md) { Copy-Item ..\docs\DIREITOS-AUTORAIS.md release\ }
          if (Test-Path ..\TUTORIAL_IMPLEMENTACAO.md) {
            Copy-Item ..\TUTORIAL_IMPLEMENTACAO.md release\
          }
          @"
          SINAPESC REAP — COMO USAR (v1.7.43)
          ==================================
          © Gabriel Lourran Da Silva Costa — Todos os direitos reservados.
          Software de Gabriel; Sindicato licenciado por prazo indeterminado;
          codigo-fonte permanece do autor. Ver LICENSE e DIREITOS-AUTORAIS.md

          1. Leia TUTORIAL_IMPLEMENTACAO.md ou COMO_INTEGRAR_API.md
          2. Renomeie o JSON do Google Cloud para google-credentials.json
             e coloque na mesma pasta deste exe.
          3. Edite config.json: ID da planilha + public_site_url
             https://anmolock.github.io/sinapesc-casanova-reap
          4. Compartilhe a planilha com o client_email (Editor)
             e como "qualquer pessoa com o link" (Leitor) para o site.
          5. Execute SinapescREAP.exe -> Configuracoes -> Testar conexao
          6. Cole a URL do site -> Salvar -> QR Consulta CPF -> imprima
          7. Login admin: abas Sócios, Pendencias, Relatorio, Backup, Auditoria
          A primeira conexao cria as abas Auditoria e Config na planilha.
          8. Defeso Facil: em Configuracoes, Escolher pasta do Google Drive
             (ex. D:\Meu Drive\Sinapesc-Defeso) para anexos sincronizarem.
          9. Na ficha Defeso, use a engrenagem para escolher a fonte da
             declaracao (Padrao, Allura ou Architects Daughter).
          10. Municipio REAP (planilha Pessoas) e municipio Defeso (declaracao)
             sao campos separados — salvar um nao altera o outro.
          11. Modulo Consulta RGP: Cadastrar socio inclui senha Gov.br (opcional)
             na planilha. Clique / Consultar / Editar abre modal de detalhes
             (Resumo e Dados cadastrais). Tabela compacta em largura total.
             CPF com zero a esquerda e normalizado (planilha/numero).
             Sync Consulta <-> REAP restrita nesta etapa.

          12. LICENCA: software proprietario — Gabriel Lourran Da Silva Costa
             gabriel730costa@gmail.com — ver LICENSE na pasta. Proibido copiar
             ou modificar sem autorizacao.

          Fallback Tkinter (legado): SinapescREAP.exe --tk
          "@ | Set-Content -Encoding UTF8 release\LEIA-ME.txt

      - name: Create ZIP
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match '^refs/tags/(v.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "dev"
          }
          Compress-Archive -Path release\* -DestinationPath "SinapescREAP-Windows-$ver.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinapescREAP-Windows
          path: |
            sinapesc-desktop/release/*
            sinapesc-desktop/SinapescREAP-Windows-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sinapesc-desktop/SinapescREAP-Windows-*.zip
          generate_release_notes: true
