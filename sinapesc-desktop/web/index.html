<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinapesc REAP</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <div class="logo-wrap" aria-hidden="true">
            <img src="../assets/logo.png" alt="SINAPESC" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <span class="logo-fallback">S</span>
          </div>
          <div class="brand-text">
            <div class="brand-short" id="org-short">Sinapesc</div>
            <div class="brand-full" id="org-full">Sindicato Dos Aquicultores E Pescadores De Casa Nova</div>
          </div>
        </div>
        <div class="header-right">
          <div class="header-email" id="header-email"></div>
          <div class="header-actions" id="header-actions"></div>
        </div>
      </div>
      <nav class="tab-bar" id="tab-bar" hidden>
        <div class="tab-inner" id="tab-inner"></div>
      </nav>
    </header>

    <div class="workspace">
      <div class="app-watermark" aria-hidden="true">
        <img src="../assets/watermark.png" alt="" />
      </div>
      <main class="content" id="content"></main>
    </div>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-left">
          <span id="status-text">Pronto.</span>
          <span class="dot">·</span>
          <span id="footer-user"></span>
          <span class="dot footer-conn-sep">·</span>
          <span id="footer-conn"></span>
        </div>
        <div class="footer-right">Sinapesc REAP</div>
      </div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/app.js"></script>
</body>
</html>
